<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">With Character — 오랑우탄 디버깅 데모</title>
  <desc id="desc">터미널에서 오랑우탄 캐릭터가 null 오류에 반응하고 한국어로 통역하는 모습.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17120f"/>
      <stop offset="1" stop-color="#2c160d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="88" r="210" fill="#ff7a33" opacity=".07"/>
  <circle cx="95" cy="585" r="260" fill="#ffb347" opacity=".05"/>

  <text x="70" y="76" fill="#fff3e8" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="34" font-weight="800">WITH CHARACTER</text>
  <text x="70" y="116" fill="#ff9f43" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="650">오랑우탄이 내 코드를 리뷰한다면?</text>

  <g transform="translate(1000 38)">
    <circle cx="80" cy="74" r="59" fill="#7c3f20"/>
    <circle cx="48" cy="73" r="27" fill="#a95b30"/>
    <circle cx="112" cy="73" r="27" fill="#a95b30"/>
    <ellipse cx="80" cy="82" rx="45" ry="39" fill="#c87a45"/>
    <circle cx="64" cy="62" r="5" fill="#1f120c"/>
    <circle cx="96" cy="62" r="5" fill="#1f120c"/>
    <path d="M58 90 Q80 109 102 90" fill="none" stroke="#371c10" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="1140" height="395" rx="22" fill="#0e0f12" stroke="#4a3024" stroke-width="2"/>
    <rect x="70" y="150" width="1140" height="54" rx="22" fill="#202126"/>
    <rect x="70" y="182" width="1140" height="22" fill="#202126"/>
    <circle cx="105" cy="177" r="8" fill="#ff5f57"/>
    <circle cx="133" cy="177" r="8" fill="#febc2e"/>
    <circle cx="161" cy="177" r="8" fill="#28c840"/>
    <text x="640" y="184" text-anchor="middle" fill="#9296a3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">with-character — bash</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,'Apple SD Gothic Neo','Noto Sans KR',monospace" font-size="23">
    <text x="105" y="249" fill="#79d98c">$</text>
    <text x="132" y="249" fill="#f3f4f6">/with-character:set 오랑우탄</text>
    <text x="105" y="292" fill="#a6abb8">✓ 통역 오랑우탄 활성화 · 자막 모드</text>

    <text x="105" y="355" fill="#79d98c">나 ›</text>
    <text x="188" y="355" fill="#f3f4f6">42번째 줄에서 null 오류를 찾았어.</text>

    <text x="105" y="418" fill="#ff9f43" font-weight="700">오랑우탄 ›</text>
    <text x="277" y="418" fill="#ffd166" font-weight="700">우끼! 우끼끼! 우우끼!</text>
    <text x="105" y="463" fill="#c8ccd6" font-style="italic">(통역: 잘 찾았어! 42번째 줄 전의 호출자를 추적해 보자.)</text>

    <rect x="105" y="494" width="545" height="34" rx="8" fill="#2b211b"/>
    <text x="121" y="518" fill="#ffb36b" font-size="17">64개 프리셋 · 한국어 + English · Random + Chaos</text>
  </g>

  <rect x="70" y="579" width="1140" height="2" fill="url(#accent)" opacity=".75"/>
  <text x="70" y="614" fill="#d9c9bd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">github.com/chungchung234/with-character</text>
  <text x="1210" y="614" text-anchor="end" fill="#ff9f43" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="18" font-weight="700">코드는 정확하게. 분위기는 미쳐 날뛴다.</text>
</svg>
